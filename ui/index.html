<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Mnemosyne</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="5" cy="6" r="2"></circle><circle cx="19" cy="6" r="2"></circle><circle cx="12" cy="20" r="2"></circle><path d="M6.5 7.5l3.5 3M17.5 7.5l-3.5 3M12 15v3"></path></svg>
      <span class="name">Mnemosyne</span>
    </div>
    <nav class="tabs" aria-label="Dashboard" id="tabs"></nav>
    <div class="meta">
      <span id="summary"></span>
      <span class="local">local only</span>
    </div>
  </header>
  <main class="main" id="main">
    <section class="panel" aria-labelledby="status-title">
      <h1 id="status-title">Dashboard</h1>
      <p id="status" class="status" role="status">Loading…</p>
      <dl id="facts" class="facts" hidden></dl>
    </section>
  </main>
</div>
</body>
</html>
