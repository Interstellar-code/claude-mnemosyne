<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .you { fill: #eff6ff; stroke: #3b82f6; }
      .hook { fill: #f0fdf4; stroke: #22c55e; }
      .model { fill: #fdf4ff; stroke: #c026d3; }
      .eng { fill: #fff7ed; stroke: #f97316; }
      .db { fill: #fefce8; stroke: #ca8a04; }
      .t { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 12.5px; fill: #334155; }
      .m { font-size: 12px; fill: #334155; font-family: ui-monospace, Menlo, monospace; }
      .h { font-size: 13px; font-weight: 700; fill: #64748b; letter-spacing: .06em; }
      .l { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .d { stroke-dasharray: 5 4; }
      .lb { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">Claude Mnemosyne: how memory flows</text>
  <text x="40" y="68" class="s">Every memory operation is one short-lived engine process. Nothing runs in the background.</text>

  <!-- column headers -->
  <text x="40" y="112" class="h">YOU</text>
  <text x="300" y="112" class="h">PLUGIN HOOKS (hooks/register.ts)</text>
  <text x="680" y="112" class="h">CLAUDE</text>
  <text x="930" y="112" class="h">ENGINE + STORE</text>

  <!-- you -->
  <rect x="40" y="130" width="210" height="64" class="box you"/>
  <text x="56" y="156" class="t">Start a session</text>
  <text x="56" y="176" class="s">any repo</text>

  <rect x="40" y="250" width="210" height="84" class="box you"/>
  <text x="56" y="276" class="t">Send a prompt</text>
  <text x="56" y="296" class="m">remember that …</text>
  <text x="56" y="314" class="m">what do you remember about …</text>

  <rect x="40" y="600" width="210" height="64" class="box you"/>
  <text x="56" y="626" class="t">/mnemosyne-setup</text>
  <text x="56" y="646" class="s">once, after install</text>

  <!-- hooks -->
  <rect x="300" y="130" width="330" height="64" class="box hook"/>
  <text x="316" y="156" class="t">session.start</text>
  <text x="316" y="176" class="s">register 4 memory tools + /mnemosyne-setup</text>

  <rect x="300" y="214" width="330" height="40" class="box hook"/>
  <text x="316" y="239" class="t">prompt.compose <tspan class="s" font-weight="400">memory rules into system prompt</tspan></text>

  <rect x="300" y="274" width="330" height="150" class="box hook"/>
  <text x="316" y="300" class="t">prompt.submit</text>
  <text x="316" y="322" class="s">• first prompt of session → recall per sentence</text>
  <text x="316" y="342" class="s">• starts with a recall term → recall now</text>
  <text x="316" y="362" class="s">• starts with a remember term → tell Claude</text>
  <text x="330" y="380" class="s">to save it once</text>
  <text x="316" y="404" class="s">Hits are attached beside the prompt.</text>

  <rect x="300" y="480" width="330" height="70" class="box hook"/>
  <text x="316" y="506" class="t">tool.call  mcp__mnemosyne__memory_*</text>
  <text x="316" y="528" class="s">remember · recall · forget · stats</text>

  <rect x="300" y="600" width="330" height="64" class="box hook"/>
  <text x="316" y="626" class="t">command.run</text>
  <text x="316" y="646" class="s">bun add @oh-my-pi/pi-mnemopi@18.11.0</text>

  <!-- model -->
  <rect x="680" y="274" width="200" height="150" class="box model"/>
  <text x="696" y="300" class="t">Claude</text>
  <text x="696" y="322" class="s">reads the rules and</text>
  <text x="696" y="340" class="s">recalled memories,</text>
  <text x="696" y="358" class="s">decides to call a</text>
  <text x="696" y="376" class="s">memory tool</text>

  <!-- engine -->
  <rect x="930" y="400" width="230" height="110" class="box eng"/>
  <text x="946" y="426" class="t">bun cli.ts mcp</text>
  <text x="946" y="448" class="s">one process per call,</text>
  <text x="946" y="466" class="s">exits when done</text>
  <text x="946" y="490" class="m">~/.claude/mnemosyne/engine</text>

  <rect x="930" y="560" width="230" height="104" class="box db"/>
  <text x="946" y="586" class="t">Memory store (SQLite)</text>
  <text x="946" y="608" class="m">~/.claude/mnemosyne/store</text>
  <text x="946" y="630" class="s">owner: global or project-…</text>
  <text x="946" y="650" class="s">separate from omp's ~/.omp</text>

  <!-- arrows -->
  <path class="l" d="M250,162 H300"/>
  <path class="l" d="M250,292 H300"/>
  <path class="l" d="M250,632 H300"/>
  <path class="l" d="M630,234 C700,234 760,240 780,272"/>
  <path class="l" d="M630,349 H680"/>
  <text x="634" y="342" class="lb">context</text>
  <path class="l" d="M780,424 C780,470 700,515 632,515"/>
  <text x="790" y="462" class="lb">tool call</text>
  <path class="l" d="M630,505 C760,505 840,455 930,455"/>
  <path class="l d" d="M630,414 C760,446 860,436 930,420"/>
  <text x="890" y="410" class="lb">recall</text>
  <path class="l" d="M630,632 C780,632 860,520 930,490"/>
  <text x="790" y="600" class="lb">install</text>
  <path class="l" d="M1045,510 V560"/>
</svg>
